spring.application.name=memories-api
server.port=${SERVER_PORT:9090}
server.tomcat.connection-timeout=60000

spring.security.user.name=admin
spring.security.user.password=admin

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# H2 Database Configuration
# Update path or set to different DB configuration
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:file:./data/db/memories.db}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:password}

# Hibernate Configuration (JPA)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# show-sql prints to stdout regardless of log levels, so it is off by default;
# use SQL_LOGGING_LEVEL / SQL_TYPE_DESCRIPTOR below to control SQL logging instead.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:FALSE}
spring.h2.console.path=/h2-console

# SQL logging via log levels: SQL_LOGGING_LEVEL controls the statements (org.hibernate.SQL),
# SQL_TYPE_DESCRIPTOR controls the bound parameter values. Valid levels: OFF/FATAL/ERROR/WARN/INFO/DEBUG/TRACE.
logging.level.org.hibernate.SQL=${SQL_LOGGING_LEVEL:DEBUG}
# Hibernate 6 logs bound parameters under org.hibernate.orm.jdbc.bind (the type.descriptor.sql
# category is the Hibernate 5 name, kept for older setups).
logging.level.org.hibernate.orm.jdbc.bind=${SQL_TYPE_DESCRIPTOR:TRACE}
logging.level.org.hibernate.type.descriptor.sql=${SQL_TYPE_DESCRIPTOR:TRACE}
